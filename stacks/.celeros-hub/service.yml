# =============================================================================
# service.yml — stack celeros-hub (denv / Swarm)
# =============================================================================
# Servidor do CelerOS Hub em os.celer.tec.br: loja de apps (App Store do
# dispositivo), canais OTA por placa (update.json + firmware.bin), central de
# ajuda online e portal web com o branding Celer. Imagem propria (FastAPI),
# conteudo estatico em NFS sincronizado pelo denv (rsync).
#
# STACK EXTERNA: vive no proprio repo da aplicacao (CelerOS-Server), no layout
# stacks/.celeros-hub/. Registro unico na maquina de dev:
#   denv external add ~/GitClones/CelerOS-Server
# Deploy (build + push + rolling update):
#   denv build --service celeros-hub --tag 0.3.0 --push   # build da versao
#   denv update celeros-hub -t 0.3.0                      # rolling update
# A TAG e a VERSAO DO SERVICO (HUB_VERSION em api/app.py): subiu a versao,
# build/deploy com a tag nova — tag inexistente no registry forca build de
# verdade (tag reescrita deixava o update pular o build e rodar codigo velho).
# Git-guard: commit + push antes de deployar (bypass: --no-git-check).

name: celeros-hub
version: latest

categories:
  - application
  - web

description: |
  CelerOS Hub — loja de apps (App Store do dispositivo), canais OTA
  (esp32/CYD e smartdisplay_4848S040), central de ajuda online e portal web
  em os.celer.tec.br. Publicacao de apps/firmware via API admin autenticada
  (tools/publish_app.py e tools/publish_firmware.py).

# Traefik fornece o entrypoint websecure + TLS para os.celer.tec.br.
dependencies:
  - traefik

ignore: false

ports: []

healthcheck:
  enabled: true
  path: "/health"
  interval: 30

monitoring:
  enabled: true
  endpoints:
    - path: "/health"
      type: "json"
    - path: "/api/info"
      type: "json"

tags:
  - celeros
  - esp32
  - appstore
  - ota
  - hub

# -----------------------------------------------------------------------------
# Imagem custom (fluxo build do denv): tag = versao da base python.
# -----------------------------------------------------------------------------
version_pattern: ^\d+\.\d+\.\d+$
example: 0.3.0
registry: maikramer/celeros-hub
tags_url: https://hub.docker.com/r/maikramer/celeros-hub/tags

build:
  context: .
  dockerfile: dockerfile.celeros-hub

# -----------------------------------------------------------------------------
# sync: o CONTEUDO do hub vai por rsync para o NFS; o compose monta em
# /data/content (rw — a API admin publica apps/firmware em runtime).
# -----------------------------------------------------------------------------
sync:
  profile: "small_config"
  enabled: true
  auto_create_dirs: true
  required_dirs:
    - "content"
    - "audit"
  files:
    - $common_files.docker_compose
    - $common_files.env_file
  dirs:
    - source: "content"
      destination: "content"
